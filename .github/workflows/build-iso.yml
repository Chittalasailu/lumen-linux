name: build-iso

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Unit tests, theme freshness, script syntax
        run: make test
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning build.sh run-qemu.sh packaging/build-debs.sh \
            components/lumen-launcher/bin/lumen-launcher \
            components/lumen-panel/bin/lumen-panel \
            components/lumen-desktop/usr/bin/lumen-session \
            components/lumen-desktop/usr/bin/lumen-screenshot \
            packaging/scripts/* iso/auto/* iso/config/hooks/live/*

  iso:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Publishing the release for a v* tag writes to the repository; the default
    # workflow token is read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space (the image build needs ~10 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h /
      - name: Build ISO in the Debian 13 container
        run: make iso
      - uses: actions/upload-artifact@v7
        with:
          name: lumen-linux-iso
          path: |
            dist/*.iso
            dist/*.sha256
          retention-days: 14
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.iso
            dist/*.sha256

  boot-test:
    # Boots the ISO that was just built, headless, and checks the desktop actually works.
    needs: iso
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        firmware: [bios, uefi]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: lumen-linux-iso
          path: dist
      - name: Install QEMU, UEFI firmware and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf python3-pil
      - name: Allow KVM for the runner user (if the runner has it)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "no /dev/kvm: the test will fall back to software emulation"
      - name: Boot the ISO and exercise the desktop
        run: python3 tests/boot_test.py --iso dist/*.iso --firmware ${{ matrix.firmware }} --out shots-${{ matrix.firmware }}
      - name: Summarise
        if: always()
        run: |
          echo "### Boot test (${{ matrix.firmware }})" >> "$GITHUB_STEP_SUMMARY"
          cat shots-${{ matrix.firmware }}/results.json >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: boot-test-${{ matrix.firmware }}
          path: |
            shots-${{ matrix.firmware }}/*.png
            shots-${{ matrix.firmware }}/results.json
          retention-days: 14
